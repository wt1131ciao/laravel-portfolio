name: Test & Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: laravel-portfolio
  REGION: asia-northeast1 # 東京リージョン

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, bcmath, zip, gd
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/laravel-portfolio/$SERVICE_NAME:$GITHUB_SHA .
          docker tag asia-northeast1-docker.pkg.dev/$PROJECT_ID/laravel-portfolio/$SERVICE_NAME:$GITHUB_SHA asia-northeast1-docker.pkg.dev/$PROJECT_ID/laravel-portfolio/$SERVICE_NAME:latest

      - name: Push Docker image to Artifact Registry
        run: |
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/laravel-portfolio/$SERVICE_NAME:$GITHUB_SHA
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/laravel-portfolio/$SERVICE_NAME:latest

      # NOTE: max-instances は 1 固定。
      # DBがSQLite(コンテナローカルディスク)なので、2台以上に同時スケールすると
      # インスタンスごとに別々のDBファイルを持ってしまい、注文データや在庫の整合性が壊れる。
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/laravel-portfolio/$SERVICE_NAME:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars="APP_ENV=production,APP_DEBUG=false,APP_KEY=${{ secrets.APP_KEY }},DB_CONNECTION=sqlite,DB_DATABASE=/var/www/html/database/database.sqlite,SESSION_DRIVER=database,CACHE_STORE=database,QUEUE_CONNECTION=database,LOG_CHANNEL=stack,LOG_LEVEL=error,FILESYSTEM_DISK=local,MAIL_MAILER=log,STRIPE_KEY=${{ secrets.STRIPE_KEY }},STRIPE_SECRET=${{ secrets.STRIPE_SECRET }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
